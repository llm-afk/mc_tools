[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-script-platform"
version = "0.1.0"
description = "MIT motor protocol and native Windows CANable CAN FD transport"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
console = ["prompt-toolkit>=3.0.48,<4"]
power = ["pyserial>=3.5,<4"]
dynamometer = ["pyserial>=3.5,<4"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["motor_platform*", "scripts*", "utils*"]
