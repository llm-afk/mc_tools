[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "production-motor-test"
version = "1.0.14"
description = "Production motor testing workstation"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5,<4",
    "reportlab>=4,<5",
    "PyMuPDF>=1.24,<2",
    "oss2>=2.19,<3",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["motor_platform*", "scripts*"]

[tool.setuptools.package-data]
"scripts.factory_test" = ["assets/*.png"]
